[project]
name = "text-to-sql-agent"
version = "0.1.0"
requires-python = "==3.13.13"
dependencies = [
    "pydantic>=2.13.5",
    "sqlglot>=30.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_sql_agent"]
